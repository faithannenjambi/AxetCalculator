<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Professional Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator-container">
    <h2>Calculator</h2>
    <form id="calculator-form" autocomplete="off">
      <div class="input-group">
        <label for="first-number">First number</label>
        <input type="text" id="first-number" name="first-number" required />
      </div>
      <div class="input-group">
        <label for="second-number">Second number</label>
        <input type="text" id="second-number" name="second-number" required />
      </div>
      <div class="input-group">
        <label for="operation">Operation</label>
        <select id="operation" name="operation">
          <option value="+">Addition (+)</option>
          <option value="-">Subtraction (-)</option>
          <option value="*">Multiplication (*)</option>
          <option value="/">Division (/)</option>
        </select>
      </div>
      <div class="button-row">
        <button type="submit">Calculate</button>
        <button type="button" id="reset-btn" class="secondary">Reset</button>
        <button type="button" id="exit-btn" class="danger">Exit</button>
      </div>
    </form>
    <div id="result" class="result-message">
      Enter two numbers and select an operation.
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
